name: 기능 제안
description: 새로운 Capability, Schema 또는 제작 자동화를 제안합니다.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 기능보다 먼저 현재의 구체적인 불편이나 한계를 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
    validations:
      required: true

  - type: dropdown
    id: compatibility
    attributes:
      label: 호환성 영향
      options:
        - 기존 Schema 1.x 내 Optional 추가
        - 기존 Schema 1.x 내 호환 변경
        - Schema Major 변경 가능성 있음
        - 아직 판단할 수 없음
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 검토한 대안
    validations:
      required: true
