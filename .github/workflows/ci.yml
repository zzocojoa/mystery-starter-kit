name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Python 설정
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 프로젝트 설치
        run: |
          python -m pip install 'pip>=26.2' 'setuptools>=83'
          python -m pip install '.[dev]'

      - name: 린트
        run: python -m ruff check .

      - name: CLI 설치 확인
        run: |
          mystery-kit --help
          mystery-runtime --help
          mystery-runtime doctor

      - name: 타입 검사
        run: python -m mypy VALIDATORS RUNTIME RUNTIME_ADAPTERS tests

      - name: 테스트
        run: python -m pytest

      - name: 패키지 빌드
        run: python -m build

      - name: 의존성 취약점 검사
        if: matrix.python-version == '3.11'
        run: python -m pip_audit
